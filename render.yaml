services:
  - type: web
    name: airost-finance-hub
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: airost-finance-db
          property: connectionString
databases:
  - name: airost-finance-db
    plan: free

